<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Stopwatch Top Pusher Button -->
  <rect x="238" y="48" width="36" height="24" rx="6" fill="#38bdf8"/>
  <rect x="248" y="72" width="16" height="20" fill="#0284c7"/>

  <!-- Stopwatch Ring -->
  <circle cx="256" cy="272" r="145" fill="none" stroke="url(#ring)" stroke-width="24"/>

  <!-- Ticks -->
  <line x1="256" y1="141" x2="256" y2="155" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="389" x2="256" y2="403" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="125" y1="272" x2="139" y2="272" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="373" y1="272" x2="387" y2="272" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

  <!-- Hour Hand (10 o'clock) -->
  <line x1="256" y1="272" x2="202" y2="207" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute Hand (2 o'clock) -->
  <line x1="256" y1="272" x2="326" y2="198" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <!-- Second Hand (Amber) -->
  <line x1="256" y1="272" x2="256" y2="180" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Pin -->
  <circle cx="256" cy="272" r="12" fill="#0284c7"/>
  <circle cx="256" cy="272" r="5" fill="#f59e0b"/>
</svg>
