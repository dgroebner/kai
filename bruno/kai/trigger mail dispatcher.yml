info:
  name: trigger mail dispatcher
  type: http
  seq: 1

http:
  method: GET
  url: "{{kaiUrl}}/shared/mail.php"
  auth:
    type: apikey
    key: token
    value: "{{kaiApiToken}}"
    placement: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
