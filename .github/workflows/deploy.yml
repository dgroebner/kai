name: Deploy to Strato

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig: Holt die gesamte Git-Historie für die echten Zeitstempel

      - name: ⏱️ Restore Git Timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, pdo, pdo_mysql, curl, mbstring, sodium

      - name: 💾 Cache Vendor
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: 📦 Install Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-dev --optimize-autoloader

      - name: 🚀 Deploy via rsync (mit Passwort) to kai_root/
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          # Installiere sshpass für die Passwort-Übergabe
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          # Führe rsync aus (Zielpfad ohne führenden Slash!)
          sshpass -e rsync -rltgoDzvO --delete -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.env' \
            --exclude='.ftpignore' \
            --exclude='storage/' \
            --exclude='concepts/' \
            ./ ${FTP_USERNAME}@${FTP_SERVER}:kai_root/