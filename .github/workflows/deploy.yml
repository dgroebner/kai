name: Deploy to Strato

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: 📦 Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 🚀 Incremental Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }} # MUSS ftp.strato.de sein!
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # Nutzt normales FTP, macht aber ein automatisches, explizites SSL-Upgrade
          protocol: ftp
          # Erlaubt verschlüsselte Verbindungen auch bei komplexen Load-Balancer-Zertifikaten
          security: loose
          server-dir: /
          state-name: .ftp-deploy-sync-state.json