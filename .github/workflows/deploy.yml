name: Deploy to Strato

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig: Holt die gesamte Git-Historie für die echten Zeitstempel

      - name: ⏱️ Restore Git Timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 💾 Cache Vendor
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: 📦 Install Dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-dev --optimize-autoloader

      - name: 🚀 Deploy via rsync to /kai_root/
        uses: Burnett01/rsync-deployments@v6
        with:
          switches: -rltgoDzvO 
          path: ./
          remote_path: /kai_root/
          remote_host: ${{ secrets.FTP_SERVER }}
          remote_user: ${{ secrets.FTP_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          exclude: |
            .git*
            .github*
            .env
            .ftpignore
            storage/
            concepts/